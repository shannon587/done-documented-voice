<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Done + Documented Voice</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fff; font: 600 1.6rem/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 1.5rem; }
  h1 { color: #ffd34d; font-size: 2.4rem; margin: .2rem 0 1rem; }
  #talk { display: block; width: 100%; min-height: 9rem; font: 800 2.4rem system-ui, sans-serif; color: #000; background: #ffd34d;
          border: .4rem solid #fff; border-radius: 1.5rem; cursor: pointer; touch-action: none; }
  #talk[aria-pressed="true"] { background: #7CFFB2; }
  #talk:focus-visible, button:focus-visible, input:focus-visible { outline: .35rem solid #4dd2ff; outline-offset: .3rem; }
  #reply { margin: 1.5rem 0; padding: 1.2rem; border: .2rem solid #ffd34d; border-radius: 1rem; min-height: 5rem; font-size: 1.9rem; }
  #heard { color: #cfd8ff; min-height: 2rem; }
  .row { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: 1rem; }
  .row button, form button { font: 700 1.5rem system-ui, sans-serif; padding: .7rem 1.2rem; background: #fff; color: #000; border: .2rem solid #fff; border-radius: .8rem; cursor: pointer; }
  form { display: flex; gap: .8rem; margin-top: 1rem; }
  input { flex: 1; font: 600 1.5rem system-ui, sans-serif; padding: .7rem; background: #111; color: #fff; border: .2rem solid #fff; border-radius: .8rem; }
  label { display: block; margin-top: 1.2rem; }
  small { font-size: 1.1rem; color: #ddd; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <h1>Done + Documented Voice</h1>
  <button id="talk" aria-pressed="false" aria-describedby="hint">Hold to talk</button>
  <p id="hint"><small>Hold the button, or press the space bar, and speak. Let go to send. Try: "Get me compliant in Idaho. We're an out-of-state LLC."</small></p>
  <p id="heard" aria-live="polite"></p>
  <div id="reply" role="status" aria-live="assertive" aria-atomic="true">Hi. Ask what your business needs.</div>
  <div class="row">
    <button type="button" data-say="next">Next</button>
    <button type="button" data-say="repeat">Repeat</button>
    <button type="button" id="stop">Stop talking</button>
  </div>
  <form id="typed">
    <label class="sr" for="q">Type a question</label>
    <input id="q" autocomplete="off" placeholder="Or type a question">
    <button>Send</button>
  </form>
  <label for="biz"><small>Business name (remembered on this device)</small></label>
  <input id="biz" autocomplete="organization">
  <p><small id="mode"></small> <small>Information only, not legal advice.</small></p>
</main>
<script>
const $ = (s) => document.querySelector(s);
const talk = $("#talk"), reply = $("#reply"), heard = $("#heard"), biz = $("#biz");
biz.value = localStorage.getItem("dd-biz") || "my-business";
biz.onchange = () => localStorage.setItem("dd-biz", biz.value.trim() || "my-business");
fetch("/api/mode").then(r => r.json()).then(m => $("#mode").textContent = "Model: " + m.model + ".");

function pickVoice() {
  const v = speechSynthesis.getVoices().filter(v => v.lang === "en-US");
  return v.find(v => /natural|neural|jenny|aria|samantha|google us/i.test(v.name)) || v[0];
}
function say(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = pickVoice() || null; u.rate = 0.95; u.lang = "en-US";
  speechSynthesis.speak(u);
}
async function ask(text) {
  heard.textContent = "You said: " + text;
  reply.textContent = "Thinking…";
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, businessId: (biz.value.trim() || "my-business").toLowerCase().replace(/\s+/g, "-") }) });
    const j = await r.json();
    reply.textContent = j.speech; say(j.speech);
  } catch { reply.textContent = "I couldn't reach the server."; say(reply.textContent); }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, finalText = "", listening = false;
function start() {
  if (listening) return;
  if (!SR) { reply.textContent = "Voice input isn't supported in this browser. Please type below, or use Chrome or Edge."; say(reply.textContent); $("#q").focus(); return; }
  speechSynthesis.cancel();
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true; finalText = "";
  rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; finalText = t; heard.textContent = t; };
  rec.onend = () => { if (listening) stop(); };
  rec.start(); listening = true;
  talk.setAttribute("aria-pressed", "true"); talk.textContent = "Listening… let go to send";
}
function stop() {
  if (!listening) return;
  listening = false; talk.setAttribute("aria-pressed", "false"); talk.textContent = "Hold to talk";
  try { rec.stop(); } catch {}
  setTimeout(() => { if (finalText.trim()) ask(finalText.trim()); else heard.textContent = "I didn't hear anything."; }, 300);
}
talk.addEventListener("pointerdown", (e) => { e.preventDefault(); start(); });
talk.addEventListener("pointerup", stop);
talk.addEventListener("pointerleave", stop);
talk.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); start(); } });
talk.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); stop(); } });
document.addEventListener("keydown", (e) => { if (e.key === " " && e.target === document.body && !e.repeat) { e.preventDefault(); talk.focus(); start(); } });
document.addEventListener("keyup", (e) => { if (e.key === " " && listening) stop(); });
document.querySelectorAll("[data-say]").forEach(b => b.onclick = () => ask(b.dataset.say));
$("#stop").onclick = () => speechSynthesis.cancel();
$("#typed").onsubmit = (e) => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { ask(q); $("#q").value = ""; } };
talk.focus();
</script>
</body>
</html>
